name: Build Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04       # Versión fija (opcional; ubuntu-latest también vale)

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verificar versión de Python
        run: python --version

      - name: Ejecutar main.py
        run: python main.py
